name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev,documents]'
      - name: Compile
        run: python -m compileall -q local_kb.py jev_test.py scripts tests
      - name: Check release for secrets and local files
        run: python scripts/check_release.py
      - name: Check website discovery files
        run: python scripts/check_site.py
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Run BM25 benchmark smoke test
        run: python scripts/benchmark.py
      - name: Verify dry-run CLI
        run: jev-rag-smoke-test --dry-run
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
