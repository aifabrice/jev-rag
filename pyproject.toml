[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-rag"
version = "0.4.0"
description = "Local knowledge search with BM25, agentic, embedding, and hierarchical Jev retrieval modes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jev RAG contributors" }]
keywords = ["jev", "rag", "vector-free-rag", "bm25", "agentic-search", "line-search", "fts5", "embedding", "retrieval", "reranking", "knowledge-base", "local-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.urls]
Homepage = "https://aifabrice.github.io/jev-rag/"
Documentation = "https://github.com/aifabrice/jev-rag#readme"
Repository = "https://github.com/aifabrice/jev-rag"
Issues = "https://github.com/aifabrice/jev-rag/issues"
Changelog = "https://github.com/aifabrice/jev-rag/releases"

[project.optional-dependencies]
documents = ["pypdf>=5,<7"]
embeddings = ["numpy>=1.24,<3"]
benchmark = ["numpy>=1.24,<3"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "twine>=5,<7",
]

[project.scripts]
jev-rag = "local_kb:main"
jev-rag-smoke-test = "jev_test:main"

[tool.setuptools]
py-modules = ["local_kb", "jev_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
