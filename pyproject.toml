[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-rag"
version = "0.2.0"
description = "Vector-free local knowledge search with SQLite BM25, Jev reranking, and grounded streaming answers."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jev RAG contributors" }]
keywords = ["jev", "rag", "bm25", "fts5", "retrieval", "reranking", "knowledge-base"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=5,<7"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "twine>=5,<7",
]

[project.scripts]
jev-rag = "local_kb:main"
jev-rag-smoke-test = "jev_test:main"

[tool.setuptools]
py-modules = ["local_kb", "jev_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
