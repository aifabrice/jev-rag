<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">重排为什么救不回没召回的文档</title>
  <desc id="desc">用 323 个查询拆解 RAG 的候选召回与证据重排。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f2"/>
      <stop offset="1" stop-color="#e9f3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f3d31" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1170" cy="-30" r="235" fill="#d5e8de"/>
  <circle cx="40" cy="680" r="225" fill="#e1ece7"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="72" y="60" width="216" height="42" rx="21" fill="#d5e8de"/>
    <text x="180" y="88" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2" fill="#17624f">RAG 失败诊断</text>
    <text x="72" y="186" font-size="54" font-weight="800" fill="#12251f">重排为什么救不回</text>
    <text x="72" y="258" font-size="64" font-weight="800" fill="#17624f">没召回的文档？</text>
    <text x="72" y="316" font-size="27" font-weight="600" fill="#385a50">用 323 个查询拆解候选 Recall 与前排质量</text>
    <g transform="translate(72 378)">
      <rect width="260" height="72" rx="18" fill="#ffffff" stroke="#c8d7d0"/>
      <text x="130" y="31" text-anchor="middle" font-size="17" fill="#60766e">第一阶段</text>
      <text x="130" y="56" text-anchor="middle" font-size="21" font-weight="700" fill="#24483d">相关文档进候选池了吗？</text>
      <path d="M278 36h58" stroke="#659183" stroke-width="3" stroke-linecap="round"/>
      <path d="M328 28l9 8-9 8" fill="none" stroke="#659183" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="354" width="260" height="72" rx="18" fill="#17624f"/>
      <text x="484" y="31" text-anchor="middle" font-size="17" fill="#d9eee6">第二阶段</text>
      <text x="484" y="56" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">相关证据排进前十了吗？</text>
    </g>
    <text x="72" y="526" font-size="20" font-weight="600" fill="#526b63">候选 Recall 决定上限 · Reranker 决定前排顺序</text>
    <text x="235" y="574" text-anchor="middle" font-size="19" font-weight="700" fill="#17624f">github.com/aifabrice/jev-rag</text>
    <g transform="translate(930 355)" filter="url(#shadow)">
      <rect width="270" height="190" rx="24" fill="#ffffff"/>
      <text x="26" y="48" font-size="17" font-weight="700" fill="#667b73">BM25 + Jev</text>
      <text x="26" y="103" font-size="44" font-weight="800" fill="#17624f">+15.57%</text>
      <text x="26" y="139" font-size="16" fill="#526b63">nDCG@10</text>
      <text x="26" y="168" font-size="16" fill="#9b5c45">Recall@30：0% 变化</text>
    </g>
  </g>
</svg>
