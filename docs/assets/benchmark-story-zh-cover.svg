<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">不依赖向量数据库的本地知识库</title>
  <desc id="desc">BM25、Agentic 关键词检索与 Jev 重排的 NFCorpus 实测封面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f2"/>
      <stop offset="1" stop-color="#e9f3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f3d31" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1155" cy="-25" r="230" fill="#d7e9df"/>
  <circle cx="30" cy="680" r="230" fill="#e0ece6"/>

  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="72" y="62" width="226" height="42" rx="21" fill="#d5e8de"/>
    <text x="185" y="90" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2" fill="#17624f">开源 · 本地知识检索</text>

    <text x="72" y="188" font-size="55" font-weight="800" fill="#12251f">不依赖向量数据库的</text>
    <text x="72" y="260" font-size="64" font-weight="800" fill="#17624f">本地知识库</text>
    <text x="72" y="316" font-size="28" font-weight="600" fill="#385a50">BM25 + Jev 重排，完整 NFCorpus 实测</text>

    <g transform="translate(72 372)">
      <rect width="190" height="70" rx="18" fill="#ffffff" stroke="#c8d7d0"/>
      <text x="95" y="43" text-anchor="middle" font-size="21" font-weight="700" fill="#24483d">本地 BM25</text>
      <path d="M208 35h42" stroke="#659183" stroke-width="3" stroke-linecap="round"/>
      <path d="M242 27l9 8-9 8" fill="none" stroke="#659183" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="268" width="205" height="70" rx="18" fill="#ffffff" stroke="#c8d7d0"/>
      <text x="370" y="43" text-anchor="middle" font-size="21" font-weight="700" fill="#24483d">Agentic 扩词</text>
      <path d="M491 35h42" stroke="#659183" stroke-width="3" stroke-linecap="round"/>
      <path d="M525 27l9 8-9 8" fill="none" stroke="#659183" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="551" width="178" height="70" rx="18" fill="#17624f"/>
      <text x="640" y="43" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Jev 重排</text>
    </g>

    <text x="72" y="518" font-size="20" font-weight="600" fill="#526b63">3,633 篇文档 · 323 个问题 · 7 条检索链路</text>
    <text x="72" y="570" font-size="19" font-weight="700" fill="#17624f">github.com/aifabrice/jev-rag</text>

    <g transform="translate(864 330)" filter="url(#shadow)">
      <rect width="330" height="216" rx="26" fill="#ffffff"/>
      <text x="28" y="50" font-size="17" font-weight="700" fill="#667b73">无向量最佳 nDCG@10</text>
      <text x="28" y="115" font-size="54" font-weight="800" fill="#17624f">0.431</text>
      <path d="M28 145h274" stroke="#e2ebe7" stroke-width="2"/>
      <text x="28" y="183" font-size="17" fill="#526b63">Agentic 关键词检索 + Jev</text>
    </g>
  </g>
</svg>
