<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">不用 Embedding 也能做 Agentic Search</title>
  <desc id="desc">两轮关键词规划、RRF 融合与 Jev 重排的实测。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f2"/>
      <stop offset="1" stop-color="#e8f2ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f3d31" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1190" cy="-10" r="230" fill="#d4e8dd"/>
  <circle cx="55" cy="680" r="225" fill="#e1ece7"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="72" y="60" width="244" height="42" rx="21" fill="#d5e8de"/>
    <text x="194" y="88" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2" fill="#17624f">AGENTIC SEARCH 实测</text>
    <text x="72" y="190" font-size="56" font-weight="800" fill="#12251f">不用 Embedding 也能做</text>
    <text x="72" y="264" font-size="66" font-weight="800" fill="#17624f">Agentic Search</text>
    <text x="72" y="320" font-size="28" font-weight="600" fill="#385a50">两轮关键词规划 + RRF + Jev</text>
    <g transform="translate(72 382)">
      <rect width="168" height="68" rx="18" fill="#ffffff" stroke="#c8d7d0"/>
      <text x="84" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#24483d">原始问题</text>
      <path d="M184 34h40" stroke="#659183" stroke-width="3" stroke-linecap="round"/>
      <path d="M216 26l9 8-9 8" fill="none" stroke="#659183" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="242" width="200" height="68" rx="18" fill="#ffffff" stroke="#c8d7d0"/>
      <text x="342" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#24483d">两轮关键词</text>
      <path d="M458 34h40" stroke="#659183" stroke-width="3" stroke-linecap="round"/>
      <path d="M490 26l9 8-9 8" fill="none" stroke="#659183" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="516" width="150" height="68" rx="18" fill="#ffffff" stroke="#c8d7d0"/>
      <text x="591" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#24483d">RRF</text>
      <path d="M682 34h40" stroke="#659183" stroke-width="3" stroke-linecap="round"/>
      <path d="M714 26l9 8-9 8" fill="none" stroke="#659183" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="740" width="168" height="68" rx="18" fill="#17624f"/>
      <text x="824" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Jev 重排</text>
    </g>
    <text x="72" y="526" font-size="20" font-weight="600" fill="#526b63">3,633 篇文档 · 323 个查询 · nDCG@10 = 0.430969</text>
    <text x="72" y="574" font-size="19" font-weight="700" fill="#17624f">github.com/aifabrice/jev-rag</text>
    <g transform="translate(980 348)" filter="url(#shadow)">
      <rect width="220" height="180" rx="24" fill="#ffffff"/>
      <text x="24" y="44" font-size="16" font-weight="700" fill="#667b73">相比 BM25 + Jev</text>
      <text x="24" y="104" font-size="48" font-weight="800" fill="#17624f">+18.9%</text>
      <text x="24" y="145" font-size="16" fill="#526b63">nDCG@10</text>
    </g>
  </g>
</svg>
